name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main   # ganti ke "master" kalau branch utama kamu "master"
  workflow_dispatch:   # bisa trigger manual dari tab Actions di GitHub

permissions:
  contents: write   # gh-pages butuh ini untuk push ke branch gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        run: npm run deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
